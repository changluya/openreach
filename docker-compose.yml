services:
  openreach:
    image: "${OPENREACH_IMAGE:-codercl/openreach:latest}"
    container_name: openreach
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "${JAVA_OPTS:--Xms128m -Xmx512m}"
      SERVER_PORT: "8080"
      OPENREACH_LOG_PATH: "/app/logs"
    volumes:
      - "${OPENREACH_LOG_DIR:-./logs}:/app/logs"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
